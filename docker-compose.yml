services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onboarding_user
      POSTGRES_PASSWORD: onboarding_pass
      POSTGRES_DB: onboarding_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding_user -d onboarding_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis — broker do Celery e cache da aplicação ──────────────────────────
  # Também substitui o LocMemCache: o throttle de login contava por processo,
  # então cada worker tinha o próprio limite e o teto efetivo multiplicava.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Django Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # A imagem e NOMEADA para worker e beat reaproveitarem. Os tres rodam o
    # mesmo codigo; o que muda e o comando. Blocos `build` separados geravam
    # tres imagens, e `docker compose build backend` deixava as outras duas
    # para tras — worker e beat quebravam sozinhos a cada dependencia nova.
    image: tcc-backend:latest
    restart: unless-stopped
    # migrate + seed + runserver (seed_data é idempotente — não duplica dados)
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/mediafiles
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Sobrepoe o .env de proposito: o `env_file` serve ao ambiente local,
      # onde SQLite e conveniente. Dentro do compose existe um Postgres, e
      # deixar o contêiner cair no SQLite mantinha o banco de verdade
      # parado — com duas bases divergentes e a verificacao acontecendo na
      # que nao vai para producao.
      DATABASE_URL: postgres://onboarding_user:onboarding_pass@db:5432/onboarding_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s

  # ── Celery Worker — executa as tasks ───────────────────────────────────────
  worker:
    # Mesma imagem do backend, construida uma vez so.
    image: tcc-backend:latest
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - media_data:/app/mediafiles
    env_file:
      - ./backend/.env
    environment:
      # Sobrepoe o .env de proposito: o `env_file` serve ao ambiente local,
      # onde SQLite e conveniente. Dentro do compose existe um Postgres, e
      # deixar o contêiner cair no SQLite mantinha o banco de verdade
      # parado — com duas bases divergentes e a verificacao acontecendo na
      # que nao vai para producao.
      DATABASE_URL: postgres://onboarding_user:onboarding_pass@db:5432/onboarding_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Garante que a imagem foi construida: e o backend que a define.
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Beat — dispara as tarefas periódicas ────────────────────────────
  beat:
    # Mesma imagem do backend, construida uma vez so.
    image: tcc-backend:latest
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      # Sobrepoe o .env de proposito: o `env_file` serve ao ambiente local,
      # onde SQLite e conveniente. Dentro do compose existe um Postgres, e
      # deixar o contêiner cair no SQLite mantinha o banco de verdade
      # parado — com duas bases divergentes e a verificacao acontecendo na
      # que nao vai para producao.
      DATABASE_URL: postgres://onboarding_user:onboarding_pass@db:5432/onboarding_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Garante que a imagem foi construida: e o backend que a define.
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  # Documentos ficam em volume próprio, fora do diretório servido pelo Django.
  media_data:
