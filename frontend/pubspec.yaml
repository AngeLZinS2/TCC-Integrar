name: onboarding_app
description: "Sistema de Integração de Colaborador (Onboarding Corporativo)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.5.1
  
  # Routing
  go_router: ^14.0.0
  
  # Networking
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.3
  
  # UI & Fonts
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

  # Charts (Painel RH)
  fl_chart: ^0.69.0

  # Interop com APIs do navegador (download de CSV no Flutter Web)
  web: ^1.1.0

dependency_overrides:
  path_provider_foundation: 2.4.0
  shared_preferences_foundation: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
